{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{template "title" .}} - Rhys Mahannah</title>

    <script>
        (function() {
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <link rel="preload" href="/static/main.css" as="style">
    <link rel="preload" href="/static/main.js" as="script">

    <link rel="stylesheet" href="/static/main.css">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">

    <script src="/static/main.js" defer></script>
</head>

<body>
    <header>
        <h1><a href="/">Rhys Mahannah</a></h1>

        <!-- Desktop Navigation -->
        <nav class="nav-links desktop-nav" aria-label="Main navigation">
            <a href="/about">About</a>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                <span class="theme-icon">🌙</span>
            </button>
        </nav>

        <button id="hamburger" class="hamburger" aria-label="Open menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="mobile-nav" role="dialog" aria-label="Mobile navigation" aria-hidden="true">
            <nav class="mobile-menu">
                <a href="/">HOME</a>
                <a href="/about">ABOUT</a>
                <button id="theme-toggle-mobile" class="theme-toggle-mobile">LIGHT</button>
            </nav>
        </div>
    </header>

<div class="header-divider"></div>

    <main>
        {{template "main" .}}
    </main>

    <footer>
        <div class="contact-links">
            <a href="https://github.com/rhysmah" target="_blank">> GitHub</a>
            <a href="https://linkedin.com/in/rhysmahannah" target="_blank">> LinkedIn</a>
        </div>

        <p>Created by Rhys. 2025.</p>
        <p>Powered by <a href="https://golang.org/" rel="noopener">Go</a>.
    </footer>

</body>
</html>
{{end}}
